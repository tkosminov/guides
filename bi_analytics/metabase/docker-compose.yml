version: '3'

services:
  metabase:
    image: metabase/metabase:latest
    env_file: .env
    ports:
      - "3000:3000"
    networks:
      - metabase-network
    links:
      - metabase-db
    depends_on:
      metabase-db:
        condition: service_started
    container_name: metabase
    restart: on-failure

  metabase-db:
    image: postgres:17-alpine
    env_file: .env
    expose:
      - "5432"
    networks:
      - metabase-network
    container_name: metabase-db
    restart: on-failure

networks:
  metabase-network:
    external: true
