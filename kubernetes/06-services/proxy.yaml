kind: Service
apiVersion: v1
metadata:
  name: ${SERVICE_NAME}
  namespace: proxy
spec:
  type: ExternalName
  externalName: ${домен_на_который_надо_проксировать}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${SERVICE_NAME}-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  rules:
  - host: ${домен_сервера_с_которого_надо_проксировать}
    http:
      paths:
      - path: ${путь_который_надо_проксировать}
        pathType: Prefix
        backend:
          service:
            name: ${SERVICE_NAME}
            port:
              number: 443
